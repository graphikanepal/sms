<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Students</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <style>
        @media screen and (max-width: 900px){
            .b-main{
                display: block;
                /* height: 150px;
                overflow: hidden;
                background-color: red; */
            }
            .b-left--div{
                /* display: block; */
                height: 100px;
                overflow: hidden;
                /* background-color: red; */
            }
            .icon-box{
                display: flex;
            }
            .b-table{
                display: block;
                .b-gender, .b-course, .b-phone{
                    font-size: 0px;
                    
                }
                .b-action{

                }
            }
        }

    </style>
</head>
<body class="b-eight-body">
    <div class="b-main">
        <div class="b-left--div" id="b-left--div">
            <div class="icon">
                <div class="icon-box">
                    <div class="icon1">
                        <img src="dashboard-logo.png">
                    </div>
                    <div class="icon2">
                        <p class="sms-dash">SMS</p>
                        <p class="name">Student management</p>
                    </div>
                </div>
                    <div class="line">
                        <button class="bar-btn" id="bar-btn" onclick="showbar()">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                    </div>
                
            </div>
            <div class="menu">

                <div class="dashboard_btn-dash">
                    <span><i class="fa-regular fa-house"></i></span>
                    <p>Dashboard</p>
                </div>
                <div class="dashboard_btn-dash">
                    <span><i class="fa-solid fa-users"></i></span>
                    <p>All Students</p>
                </div>
                <div class="dashboard_btn-dash">
                    <span><i class="fa-solid fa-user-plus"></i></span>
                    <p>Add Student</p>
                </div>
                <div class="dashboard_btn-dash">
                    <span><i class="fa-solid fa-magnifying-glass"></i></span>
                    <p>Search Student</p>
                </div>
                <div class="dashboard_btn-dash">
                    <span><i class="fa-solid fa-right-from-bracket"></i></i></span>
                    <p>Logout</p>
                </div>

            </div>
        </div>
        <div class="rightkodiv">
            <div class="b-top">
                <h1>
                    Search Student
                </h1>
            </div>

            <div class="b-search">
                <input type="text" placeholder="Search students...">
                <button class="b-btn-search">
                    Search
                </button>
            </div>

            <div class="b-btm">
                
                <table class="b-table">
                    <tr class="top-row-b">
                        <th class="b-id">ID</th>
                        <th class="b-name">Name</th>
                        <th class="b-gender">Gender</th>
                        <th class="b-course">Course</th>
                        <th class="b-phone">Phone</th>
                        <th class="b-per">Percentage</th>
                        <th class="b-action">Action</th>
                    </tr>

                    <tr>
                        <td class="b-id">32</td>
                        <td class="b-name">Sagar Pokharel</td>
                        <td class="b-gender">Male</td>
                        <td class="b-course">BCA</td>
                        <td class="b-phone">9812345678</td>
                        <td class="b-per">88.60%</td>
                        <td class="b-last-btn-design">
                            <button class="b-view" >View</button>
                            <button class="b-edit">Edit</button>
                            <button class="b-del">Delete</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script>
        let check = true;
        function showbar(){
            if(check == true){
                document.getElementById("bar-btn").innerHTML = "<i class='fa-solid fa-xmark'></i>"
                document.getElementById("b-left--div").style.height = "70%";
                check = false;
            }
            else{
                document.getElementById("bar-btn").innerHTML = "<i class='fa-solid fa-bars'></i>"
                document.getElementById("b-left--div").style.height = "100px";
                check = true;
            }
        }


    </script>
</body>
</html>
