<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="b-eight-body">
    <div class="b-main">
        <div class="left_div leftkodiv">
                <div class="icon">
                    <div class="icon1">
                        <img src="logo_login.png">
                    </div>
                    <div class="icon2">
                        <p class="sms">SMS</p>
                        <p class="name">Student management</p>
                    </div>
                </div>
                <div class="menu">

                    <div class="dashboard_btn">
                        <span><i class="fa-regular fa-house"></i></span>
                        <p>Dashboard</p>
                    </div>
                    <div class="dashboard_btn">
                        <span><i class="fa-solid fa-users"></i></i></span>

                    </div>
                    <div class="dashboard_btn">
                        <span><i class="fa-solid fa-user-plus"></i></span>
                        <p>Add Student</p>
                    </div>
                    <div class="dashboard_btn">
                        <span><i class="fa-solid fa-magnifying-glass"></i></span>
                        <p>Search Student</p>
                    </div>
                    <div class="dashboard_btn">
                        <span><i class="fa-solid fa-right-from-bracket"></i></i></span>
                        <p>Logout</p>
                    </div>

                </div>
            </div>
        <div class="rightkodiv">
            <div class="b-top">
                <h1>
                    Search Student
                </h1>
                <button>
                    Search
                </button>
            </div>

            <div class="b-search">
                <input type="text" placeholder="Search students...">
            </div>

            <div class="b-btm">
                
                <table class="b-table" bgcolor="red" border="1px">
                    <tr class="top-row-b">
                        <th>ID</th>
                        <td>Name</th>
                        <th>Gender</th>
                        <th>Course</th>
                        <th>Phone</th>
                        <th>Percentage</th>
                        <th>Action</th>
                    </tr>

                    <tr>
                        <td>32</td>
                        <td>Sagar Pokharel</td>
                        <td>Male</td>
                        <td>BCA</td>
                        <td>9812345678</td>
                        <td>88.60%</td>
                        <td>
                            <button class="b-view">View</button>
                            <button class="b-edit">Edit</button>
                            <button class="b-del">Delete</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
