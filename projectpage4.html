<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <style>
          *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: #14243a;
            padding: 30px;
            height: 100vh;
            justify-content: center;
            display: flex;
            align-items: center;
    }
    
    .pagedive{
        display: flex;
        width: 95%;
        height: 90%;
        border-radius: 15px;
    }

    .left_dive {
        border-top-left-radius: 15px;
        border-bottom-left-radius: 15px;
        background-color: #434dcb;
        padding: 20px;
        color: gray;
        width: 22%;
        height: 100%;
        background-color: aliceblue;
        font-family: sans-serif;
        

    }

    .icone {
        margin-top: 15px;
        display: flex;
        margin-bottom: 40px;

    }

    .icon1e {
        margin-right: 8px;

        img {
            width: 50px;
            height: 50px;
        }
    }

    .icon2e {
        .smss {
            font-size: 30px;
            color: #2c51d8;
            font-weight: 500;
        }

        .namu {
            font-size: 15px;
        }
    }

    .mene {
        font-size: 23px;
        
        div{
            font-weight: 500;
            margin-bottom: 19px;
            font-size: 15px;
        }
        i{
            margin-right: 10px;
        }
        span{
            font-weight: 600;
        }
    }

        .partsec{
            background-color: white;
            width: 78%;
            border-top-right-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        .plus{
            width: 100%;
            font-size: 25px;
            font-family: sans-serif;
            height: 80px;
            font-weight: 600;
            padding-top: 26px;
            padding-left: 10px;
            padding-right: 30px;
            background-color: white;
            border-top-right-radius: 15px;
            
        }
    
        .teble{
            width: 100%;
            color: black;
           
        }
        table{
            
          
          
           height: 472px;
            width: 100%;
            text-align: left;
            font-family: sans-serif;
        
        }
        td{
            font-weight: bold;
           
            padding-left: 10px;
        }
        input{
            width: 80%;
            outline: none;
            border: none;
            height: 30px;
        
        }
        select{
            width: 80%;
            height: 30px;
            outline: none;
            border: none;
        }

        .end{
            width: 100%;
            
            height: 89px;
             border-bottom-right-radius: 15px;
             padding-top: 20px;
             padding-left: 15px;

             .save{
                width: 160px;
                height: 45px;
                border: none;
                border-radius: 10px;
                background-color: #2c51d8 ;
                font-weight: 600;
                color: white;
                font-size: 16px;

             }
             input{
                border: none;
                outline: none;
                text-align: left;
                padding-left: 38px;
                font-size: 16px;
                font-weight: 500;
             }
        }


    </style>
</head>
<body>


    <div class="pagedive">



     <div class="left_dive">


            <div class="icone">

                <div class="icon1e">
                    <img src="smsblue.png"/>
                </div>

                <div class="icon2e">
                    <p class="smse">SMS</p>
                    <p class="namu">Student management</p>
                </div>

            </div>

            <div class="mene">

                <div class="dashboard_bte">
                    <span><i class="fa-regular fa-house"></i></span>
                Dashboard
                </div>

                <div class="dashboard_bte">
                    <span><i class="fa-solid fa-users"></i></i></span>
                All Students
                </div>

                <div class="dashboard_bte">
                    <span><i class="fa-solid fa-user-plus"></i></span>
                Add Student
                </div>

                <div class="dashboard_bte">
                    <span><i class="fa-solid fa-magnifying-glass"></i></span>
                Search Student
                </div>

                <div class="dashboard_bte">
                    <span><i class="fa-solid fa-right-from-bracket"></i></i></span>
                Logout
                </div>

             </div>

        </div>



        <div class="partsec">
            <div class="plus">
                Add New Student
            </div>
            <div class="teble">
                <table>
                    <tr>
                        <td>Full Name</td>
                        <td>Date of Birth</td>
                    </tr>

                    <tr>
                        <td><input type="text" placeholder="Enter Full Name"></td>
                        <td><input type="date"></td>
                    </tr>

                    <tr>
                        <td>Gender</td>
                        <td>Email</td>
                    </tr>

                    <tr>
                        <td><select name="select Gender" id="">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="other">other</option>
                        </select></td>
                        <td><input type="email" placeholder="Enter email"></td>
                    </tr>

                    <tr>
                        <td>Phone</td>
                        <td>Address</td>
                    </tr>

                    <tr>
                        <td><input type="text" placeholder="Enter phone number"></td>
                        <td><input type="text" placeholder="Enter address"></td>
                    </tr>

                    <tr>
                        <td>Course</td>
                        <td>Percentage</td>
                    </tr>

                     <tr>
                        <td><select name="select course" id="">
                            <option value="">Select Course</option>
                            <option value="">BCA</option>
                            <option value="">BIT</option>
                            <option value="">BCS</option>
                            <option value="">BBA</option>
                            <option value="">BBS</option>
                        </select></td>
                        <td><input type="text" placeholder="Enter percentage"></td>
                    </tr>

                </table>
            </div>

                <div class="end">
                    <button class="save">Save Student</button>
                   <input type="reset" value="Reset">
                </div>

        </div>

        </div>
</body>
</html>
