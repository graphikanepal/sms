<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<style>
    
</style>

<body>
    <div class="main">
        <div class="left_div">
            <div class="icon">
                <div class="icon1">
                    <img src="icon.png">
                </div>
                <div class="icon2">
                    <p class="sms">SMS</p>
                    <p class="name">Student management</p>
                </div>
            </div>
            <div class="menu">

                <div class="dashboard">
                    <span><i class="fa-regular fa-house"></i></span>
                    <p>Dashboard</p>
                </div>
                <div class="dashboard">
                    <span><i class="fa-solid fa-users"></i></i></span>
                    <p>All Students</p>
                </div>
                <div class="dashboard">
                    <span><i class="fa-solid fa-user-plus"></i></span>
                    <p>Add Student</p>
                </div>
                <div class="dashboard">
                    <span><i class="fa-solid fa-magnifying-glass"></i></span>
                    <p>Search Student</p>
                </div>
                <div class="dashboard">
                    <span><i class="fa-solid fa-right-from-bracket"></i></i></span>
                    <p>Logout</p>
                </div>

            </div>
        </div>
        <div class="mid_div">
            <img src="img.png">
            <div class="mid_parag">
                <h2>Welcome to SMS</h2>
                <p>Mange your student easily and efficiently</p>
            </div>
        </div>
        <div class="right_div">
            <div class="login_form">
                <h2>Login to Your Account</h2>
                <p class="username">Username</p>
                <input type="text" placeholder="Enter username" id="username">
                <p class="Password">Password</p>
                <input type="password" placeholder="Enter password" id="pass">
                <input type="checkbox" id="checkbox">
                <label>Remember me</label>
                <button id="login_btn">Login</button>
            </div>
            <p class="login_lastpart">@2024 Student Mangement System</p>
        </div>
    </div>
</body>

</html>
